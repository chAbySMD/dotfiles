[colors.primary]
background = "{{colors.background.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

dim_foreground = "{{colors.on_surface_variant.default.hex}}"
bright_foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.on_surface_variant.default.hex}}"
cursor = "{{colors.on_surface.default.hex}}"

[colors.selection]
text = "{{colors.on_secondary.default.hex}}"
background = "{{colors.secondary_fixed_dim.default.hex}}"

[colors.normal]
black   = "{{colors.surface.default.hex}}"
red     = "{{colors.error.default.hex | set_lightness: -10.0}}"
green   = "{{colors.tertiary.default.hex | set_lightness: -10.0}}"
yellow  = "{{colors.primary_fixed.default.hex | set_lightness: -10.0}}"
blue    = "{{colors.error.default.hex | set_lightness: -10.0}}"
magenta = "{{colors.tertiary.default.hex | set_lightness: -10.0}}"
cyan    = "{{colors.primary_fixed.default.hex | set_lightness: -10.0}}"
white   = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black   = "{{colors.surface_variant.default.hex}}"
red     = "{{colors.error.default.hex | set_lightness: 0.0}}"
green   = "{{colors.tertiary.default.hex | set_lightness: 0.0}}"
yellow  = "{{colors.primary_fixed.default.hex | set_lightness: 0.0}}"
blue    = "{{colors.error.default.hex | set_lightness: 0.0}}"
magenta = "{{colors.tertiary.default.hex | set_lightness: 0.0}}"
cyan    = "{{colors.primary_fixed.default.hex | set_lightness: 0.0}}"
white   = "{{colors.on_surface.default.hex}}"

[[colors.indexed_colors]]
index = 16
color = "{{colors.primary.default.hex}}"

[[colors.indexed_colors]]
index = 17
color = "{{colors.on_surface_variant.default.hex}}"
